# Weekly version updates (security.md D2). Dependabot alerts and security updates are on in the
# repo settings; this file adds the routine bumps.
version: 2
updates:
  # The npm workspace: Dependabot reads the root package.json (its workspaces) and package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it: hijacked versions are usually caught and
    # pulled from the registry within days.
    cooldown:
      default-days: 7
    groups:
      # One PR a week for the tooling, instead of one per package.
      dev-dependencies:
        dependency-type: development
    ignore:
      # React is a peer of @bit-ds/react. A new major changes what consumers must install, so it is a
      # deliberate change (and a release), never an automatic bump. Minors and patches still come.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # TypeScript 7 has no classic JS API, which tsup's dts build and typescript-eslint (peer
      # <6.1.0) both need, so a major is a planned move. 6 is done (by hand, for 0.1.11); 7 waits until
      # tsup is replaced or stops forcing baseUrl (see packages/react/tsup.config.ts).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The types follow the Node major CI and the gallery run (22), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it: hijacked versions are usually caught and
    # pulled from the registry within days.
    cooldown:
      default-days: 7
