name: Release

# Pull requests run `dry-run`. A pushed v* tag runs guard -> build -> publish -> verify-install, and
# site-build -> deploy for the Pages site; deploy waits for verify-install, so the site changes only
# after a good publish. A push to main, or a manual "Run workflow" of Release on main, runs
# docs-check -> docs-build -> docs: it deploys the site without a release, but only while packages/
# is unchanged since the latest release tag. See CONTRIBUTING.md, "Releasing".
#
# Privilege is split (security.md C1, C2). The jobs that install dependencies or run their code
# (dry-run, build, site-build, docs-build) hold no secret, no OIDC token and no environment. The jobs
# that hold one (publish, deploy, docs) install nothing: publish checks the hash of the tarball the
# build job made and publishes it, and deploy and docs only run actions/deploy-pages.
on:
  pull_request:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

# Read-only by default. Jobs that need more ask for it.
permissions:
  contents: read

env:
  # The one npm the release uses. Provenance and trusted publishing need 11.5.1 or later, and Node 22
  # ships npm 10. Exact, so a new npm never reaches the publish job unreviewed. Dependabot can't see
  # this, so bump it by hand; the dry run on that PR rehearses the new version.
  NPM_VERSION: 11.21.0

# All tag runs share one group, so two tags never publish or deploy at the same time.
# A release in progress is never cancelled. Main runs get their own group, so a docs deploy
# never replaces a waiting release. Pull requests get one group each, and a new push cancels the
# older dry run. The two Pages deploy jobs also share the `pages` group (see deploy and docs).
# Note: GitHub keeps one pending run per group. A third tag pushed while one runs and one waits
# replaces the waiting run, which then needs re-running.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'tags' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Proves on every PR that the package would publish, without any secret or OIDC token.
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history, so the versioned-site rehearsal can check out v0.1.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # From here to the smoke test, the steps are the build job's, word for word
      # (workflows.test.mjs pins them equal), so the PR rehearses exactly what a tag builds.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the pinned npm
        run: npm install -g --ignore-scripts "npm@$NPM_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm verify
      # prepack copies README.md and LICENSE into the package. pnpm 9 rejects `--filter` on pack
      # ("Unknown option: 'recursive'"), so point --dir at the package. The hash is taken here,
      # before the smoke test runs any registry code, and publish checks the tarball against it.
      - name: Pack
        id: pack
        run: |
          pnpm --dir packages/react pack --pack-destination "$RUNNER_TEMP/out"
          # nullglob: no tarball gives an empty array, not a literal "*.tgz" that counts as one.
          shopt -s nullglob
          tgz=("$RUNNER_TEMP"/out/*.tgz)
          [ ${#tgz[@]} -eq 1 ] || { echo "::error::expected exactly one tarball, found ${#tgz[@]}"; exit 1; }
          sha256=$(sha256sum "${tgz[0]}" | cut -d ' ' -f 1)
          {
            echo "tgz=${tgz[0]}"
            echo "name=${tgz[0]##*/}"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "packed ${tgz[0]##*/}, sha256 $sha256"
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # smoke:full uses the root `playwright` package. Runs on a cache hit too, for the system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # smoke:full tests this exact tarball (SMOKE_TARBALL), and it is the file that would be published.
      - name: Smoke test
        id: smoke
        run: pnpm smoke:full
        env:
          SMOKE_TARBALL: ${{ steps.pack.outputs.tgz }}
      # End of the steps shared with the build job.
      # npm 11 refuses even a dry run over a version that is already on npm. So, like the real
      # publish, the dry run happens only for a new version. Other PRs say so and move on.
      - name: Decide whether this version is new
        id: decide
        run: node scripts/release-steps.mjs should-publish
      - name: npm publish --dry-run
        if: steps.decide.outputs.publish == 'true'
        # A dry run never signs, so publishConfig.provenance needs no OIDC token here.
        run: npm publish "$TGZ" --dry-run --access public
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
      - name: Note the skipped dry run
        if: steps.decide.outputs.publish == 'false'
        run: echo "::notice::This version is already on npm. Bump packages/react/package.json to dry-run a publish."
      - run: pnpm gallery:build
      # Rehearses the deploy's versioned site. --as-older archives v0.1.0 at v0.1/ although it shares
      # the current line, so archiving and the injected banner run before a second line exists.
      - name: Build the versioned site
        run: node scripts/build-versioned-site.mjs --out "$RUNNER_TEMP/site" --as-older v0.1.0
      # Asserts index.html at the root, v0.1/index.html, a valid versions.json, and the banner
      # script in the archives only.
      - name: Check the versioned site
        run: node scripts/build-versioned-site.mjs --check "$RUNNER_TEMP/site" --as-older v0.1.0

  # Fails fast, before anyone is asked to approve a publish.
  guard:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The repo is public, so the fetch of main below needs no stored token.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # release-steps.mjs uses only Node built-ins, so this job needs no install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches the package version
        run: node scripts/release-steps.mjs check-tag "$GITHUB_REF_NAME"
      - name: The tag commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

  # Installs, builds, verifies, packs and smoke-tests the tarball with no secret, no OIDC token and no
  # environment, so no install script or registry package ever runs next to a publish credential.
  # It hands publish the tarball as an artifact, and its name and sha256 as outputs.
  build:
    needs: guard
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      tgz-name: ${{ steps.pack.outputs.name }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # From here to the smoke test, the steps are dry-run's, word for word
      # (workflows.test.mjs pins them equal).
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the pinned npm
        run: npm install -g --ignore-scripts "npm@$NPM_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm verify
      # prepack copies README.md and LICENSE into the package. pnpm 9 rejects `--filter` on pack
      # ("Unknown option: 'recursive'"), so point --dir at the package. The hash is taken here,
      # before the smoke test runs any registry code, and publish checks the tarball against it.
      - name: Pack
        id: pack
        run: |
          pnpm --dir packages/react pack --pack-destination "$RUNNER_TEMP/out"
          # nullglob: no tarball gives an empty array, not a literal "*.tgz" that counts as one.
          shopt -s nullglob
          tgz=("$RUNNER_TEMP"/out/*.tgz)
          [ ${#tgz[@]} -eq 1 ] || { echo "::error::expected exactly one tarball, found ${#tgz[@]}"; exit 1; }
          sha256=$(sha256sum "${tgz[0]}" | cut -d ' ' -f 1)
          {
            echo "tgz=${tgz[0]}"
            echo "name=${tgz[0]##*/}"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          echo "packed ${tgz[0]##*/}, sha256 $sha256"
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # smoke:full uses the root `playwright` package. Runs on a cache hit too, for the system libraries.
      - run: pnpm exec playwright install --with-deps chromium
      # smoke:full tests this exact tarball (SMOKE_TARBALL), and it is the file that would be published.
      - name: Smoke test
        id: smoke
        run: pnpm smoke:full
        env:
          SMOKE_TARBALL: ${{ steps.pack.outputs.tgz }}
      # End of the steps shared with dry-run.
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error

  # Publishes the tarball the build job made and tested. It runs no install and no third-party code:
  # no pnpm, no dependency cache, and the checkout is only for release-steps.mjs (Node built-ins
  # only) and the package version. The one download besides the artifact is the pinned npm itself.
  publish:
    needs: [guard, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The environment allows only v* tags, needs a reviewer, and holds NPM_TOKEN.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # signs the provenance statement
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install the pinned npm
        run: npm install -g --ignore-scripts "npm@$NPM_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/release
      # The artifact must be exactly the one file the build job packed, byte for byte.
      - name: Verify the tarball
        id: tarball
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the build job gave no sha256"; exit 1; }
          [[ "$TGZ_NAME" =~ ^[A-Za-z0-9._-]+\.tgz$ ]] || { echo "::error::the build job gave a bad tarball name: $TGZ_NAME"; exit 1; }
          shopt -s nullglob dotglob
          files=("$RUNNER_TEMP"/release/*)
          tgz="$RUNNER_TEMP/release/$TGZ_NAME"
          if [ ${#files[@]} -ne 1 ] || [ "${files[0]}" != "$tgz" ] || [ ! -f "$tgz" ]; then
            echo "::error::the artifact must hold only $TGZ_NAME, found: ${files[*]##*/}"
            exit 1
          fi
          actual=$(sha256sum "$tgz" | cut -d ' ' -f 1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::sha256 mismatch for $TGZ_NAME: the build job packed $EXPECTED_SHA256, the artifact is $actual"
            exit 1
          fi
          echo "$TGZ_NAME matches the build job's sha256 $actual"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
        env:
          TGZ_NAME: ${{ needs.build.outputs.tgz-name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      # Writes publish=true, or publish=false when this version is already on npm (a re-run).
      - name: Decide whether to publish
        id: decide
        run: node scripts/release-steps.mjs should-publish
      # The default success() also applies, so any earlier failure skips this step.
      - name: Publish to npm
        id: publish
        if: steps.decide.outputs.publish == 'true'
        run: npm publish "$TGZ" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TGZ: ${{ steps.tarball.outputs.tgz }}

  # Runs after a successful publish, or after the publish was skipped because the version already
  # exists (a re-run). It waits for npm to show the version, then installs it, with no secret.
  verify-install:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the published version installs
        run: node scripts/release-steps.mjs verify-install "${GITHUB_REF_NAME#v}"

  # Builds the tag's Pages site with no Pages permission. It runs alongside build and publish;
  # deploy uses its artifact only after verify-install passes.
  site-build:
    needs: guard
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Full history, so the tags of the older lines exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the library, then the gallery with base /bit-design-system/.
      - run: pnpm gallery:build
      # Each older line is a frozen copy of its newest tag. The key names the build recipe (v2, see
      # CACHE_PREFIX in the script) and those tags, so a new patch on an old line rebuilds just that
      # copy; restore-keys brings back the copies this recipe already built.
      - name: Name the archive cache
        id: archives
        run: echo "key=$(node scripts/build-versioned-site.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/archive-cache
          key: ${{ steps.archives.outputs.key }}
          restore-keys: site-archives-v2-
      # The current gallery at the root, each older line at v<line>/, versions.json and the banner.
      - name: Build the versioned site
        run: node scripts/build-versioned-site.mjs --out "$RUNNER_TEMP/site" --cache "$RUNNER_TEMP/archive-cache"
      # `with:` is not a shell, so the path uses runner.temp, not $RUNNER_TEMP.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  # Deploys the site site-build uploaded, once the release is on npm and installs. Nothing else runs here.
  deploy:
    needs: [site-build, verify-install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Shared with docs: one Pages deploy at a time, never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Docs changes don't make a release (CONTRIBUTING.md, "Releasing"). A push to main, or a manual
  # run on main, deploys the same site as a tag, but only while packages/ is unchanged since the
  # latest release tag, so the root never shows unreleased component behaviour as the current
  # version. Otherwise it skips with a notice, and the next tag deploys.
  # docs-check holds no Pages slot and no environment: a skip never queues in `pages` (where it could
  # replace a waiting tag deploy) and never records a deployment.
  docs-check:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.released.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Writes deploy=true when packages/ matches the latest release tag on HEAD (pre-releases
      # skipped). `|| true` keeps the tag pipeline safe under pipefail when there are no tags.
      - name: Packages are unchanged since the latest release
        id: released
        run: |
          LATEST=$(git tag --list 'v[0-9]*' --merged HEAD --sort=-v:refname | grep -Ev -- '-' | head -1 || true)
          # Test-only paths never make a release, so a change to them must not block the docs deploy.
          IGNORED=(
            ':(exclude,glob)packages/**/*.test.*'
            ':(exclude,glob)packages/**/__tests__/**'
            ':(exclude,glob)packages/**/src/test/**'
            ':(exclude,glob)packages/**/vitest.*'
            ':(exclude)packages/react/scripts/verify-dist.mjs'
            ':(exclude)packages/react/scripts/expected-exports.mjs'
          )
          if [ -z "$LATEST" ]; then
            echo "::notice::no release tag yet; docs deploy waits for the first release"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LATEST" HEAD -- packages/ "${IGNORED[@]}"; then
            echo "packages/ is unchanged since $LATEST"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # git diff --quiet exits 1 for "differs"; anything else is a git error.
            [ "$status" -eq 1 ] || { echo "::error::git diff failed ($status)"; exit "$status"; }
            echo "::notice::packages/ changed since $LATEST; docs deploy waits for the next release"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds main's Pages site with no Pages permission, the same way site-build does for a tag.
  docs-build:
    needs: docs-check
    if: needs.docs-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      # Full history, so the tags of the older lines exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the library, then the gallery with base /bit-design-system/.
      - run: pnpm gallery:build
      # Each older line is a frozen copy of its newest tag. The key names the build recipe (v2, see
      # CACHE_PREFIX in the script) and those tags, so a new patch on an old line rebuilds just that
      # copy; restore-keys brings back the copies this recipe already built.
      - name: Name the archive cache
        id: archives
        run: echo "key=$(node scripts/build-versioned-site.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/archive-cache
          key: ${{ steps.archives.outputs.key }}
          restore-keys: site-archives-v2-
      # The current gallery at the root, each older line at v<line>/, versions.json and the banner.
      - name: Build the versioned site
        run: node scripts/build-versioned-site.mjs --out "$RUNNER_TEMP/site" --cache "$RUNNER_TEMP/archive-cache"
      # `with:` is not a shell, so the path uses runner.temp, not $RUNNER_TEMP.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  # Deploys the site docs-build uploaded. Nothing else runs here.
  docs:
    needs: [docs-check, docs-build]
    if: needs.docs-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Shared with the tag deploy: one Pages deploy at a time, never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
