name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: the gallery resolves @bit/react through its gitignored dist.
      - run: pnpm build && pnpm verify
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @bit/core test
      - run: pnpm test:coverage
      - run: pnpm --filter @bit/gallery test
      - run: pnpm smoke
      - run: pnpm storybook:build
